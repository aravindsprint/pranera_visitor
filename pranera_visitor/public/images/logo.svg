<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pranera Visitor App: visitor badge on a lanyard clip -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26497a"/>
      <stop offset="1" stop-color="#16304f"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- lanyard straps -->
  <path d="M38 4 L46 20 M62 4 L54 20" stroke="#f5a524" stroke-width="5" stroke-linecap="round"/>
  <!-- clip -->
  <rect x="42" y="17" width="16" height="9" rx="3" fill="#c7d6ea"/>
  <rect x="46" y="20" width="8" height="3" rx="1.5" fill="#16304f"/>
  <!-- badge card -->
  <rect x="24" y="24" width="52" height="66" rx="8" fill="#ffffff"/>
  <!-- slot -->
  <rect x="43" y="29" width="14" height="3.2" rx="1.6" fill="#c7d6ea"/>
  <!-- person -->
  <circle cx="50" cy="47" r="8.5" fill="#1e3a5f"/>
  <path d="M34.5 70 C35.5 60 42 56.5 50 56.5 C58 56.5 64.5 60 65.5 70 Z" fill="#1e3a5f"/>
  <!-- VISITOR band -->
  <path d="M24 74 H76 V82 A8 8 0 0 1 68 90 H32 A8 8 0 0 1 24 82 Z" fill="#f5a524"/>
  <g fill="#16304f">
    <rect x="31" y="80.2" width="38" height="3.6" rx="1.8"/>
  </g>
</svg>
